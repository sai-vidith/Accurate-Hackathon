# Netlify: the website only. The API runs on Render (see DEPLOY.md).
# In Netlify > Site configuration > Environment variables, set VITE_API_URL to your Render address,
# e.g. https://disruption-copilot.onrender.com, then redeploy.
[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The API is called directly on Render, not proxied: Netlify proxies time out after 26 seconds, and drafting a plan
# from an idea (or waking a sleeping free Render service) can take longer.

# Single-page app: every address loads index.html, so refreshing a trip page works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
